name: Build

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:

  build:
    runs-on: windows-2022
    # Safety net: a hung step (e.g. a spawned test process that never exits) should fail fast,
    # not burn the default 6-hour job timeout every time it happens.
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@v5

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    # GitHub Actions runners set CI=true automatically — RendererProcessHostTests reads it to
    # skip the two tests that spawn a real renderer process (see that file's comment: one such
    # test hung indefinitely on windows-2022, never exiting within its own 20s Wait()).
    - name: Test
      run: dotnet test tests/WatchAlong.Tests/WatchAlong.Tests.csproj --configuration Release

    - name: Build with dotnet
      run: dotnet build WatchAlong.slnx --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WatchAlong
        path: .\WatchAlong\bin\x64\Release\*
        if-no-files-found: error
        retention-days: 7
